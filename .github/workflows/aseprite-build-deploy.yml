name: Build Aseprite for Debian 13 and Arch Linux

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      aseprite_tag:
        description: "Upstream Aseprite tag (empty = latest release)"
        required: false
        default: ""
        type: string
      skia_release_tag:
        description: "Upstream aseprite/skia release tag or major prefix (e.g. m124)"
        required: false
        default: "m124"
        type: string
      deb_revision:
        description: "Debian revision suffix"
        required: false
        default: "1"
        type: string
      arch_pkgrel:
        description: "Arch package release number"
        required: false
        default: "1"
        type: string
      build_arch_package:
        description: "Build Arch Linux .pkg.tar.zst package"
        required: false
        default: true
        type: boolean
      release_tag:
        description: "Release tag in this repository (empty = auto)"
        required: false
        default: ""
        type: string
      release_name:
        description: "Release name in this repository (empty = auto)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-debian-assets:
    runs-on: ubuntu-latest
    outputs:
      aseprite_tag: ${{ steps.meta.outputs.aseprite_tag }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      tar_name: ${{ steps.meta.outputs.tar_name }}
      deb_name: ${{ steps.meta.outputs.deb_name }}
      pkgver: ${{ steps.meta.outputs.pkgver }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang cmake ninja-build libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev curl jq unzip tar dpkg-dev

      - name: Resolve upstream metadata
        id: meta
        env:
          INPUT_ASEPRITE_TAG: ${{ github.event.inputs.aseprite_tag }}
          INPUT_SKIA_RELEASE_TAG: ${{ github.event.inputs.skia_release_tag || 'm124' }}
          INPUT_DEB_REVISION: ${{ github.event.inputs.deb_revision || '1' }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api_call() { curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "$@"; }
          clean_version() { printf '%s' "${1#v}" | tr -c "${2}" '.' | sed 's/^\.//;s/\.$//' ; }

          aseprite_api="https://api.github.com/repos/aseprite/aseprite/releases/$([ -n "${INPUT_ASEPRITE_TAG}" ] && echo "tags/${INPUT_ASEPRITE_TAG}" || echo "latest")"
          aseprite_json="$(api_call "${aseprite_api}")"
          aseprite_tag="$(jq -r '.tag_name' <<<"${aseprite_json}")" && [ -n "${aseprite_tag}" ] || { echo "Failed to resolve Aseprite tag from: ${aseprite_api}" >&2; exit 1; }
          source_zip_url="$(jq -r '[.assets[] | select(.name | test("Aseprite-.*-Source\\.zip"))][0].browser_download_url' <<<"${aseprite_json}")" && [ -n "${source_zip_url}" ] || { echo "Failed to find source zip" >&2; exit 1; }

          skia_json="$(api_call "https://api.github.com/repos/aseprite/skia/releases/tags/${INPUT_SKIA_RELEASE_TAG}" 2>/dev/null)" || {
            skia_json="$(api_call "https://api.github.com/repos/aseprite/skia/releases?per_page=100")"
            skia_json="$(jq -c --arg sel "${INPUT_SKIA_RELEASE_TAG}" '[.[] | select((.tag_name // "") == $sel or (.tag_name // "" | startswith($sel + "-")))] | first' <<<"${skia_json}")"
          }
          skia_release_tag="$(jq -r '.tag_name' <<<"${skia_json}")" && [ -n "${skia_release_tag}" ] || { echo "Failed to resolve skia tag" >&2; exit 1; }
          skia_zip_url="$(jq -r '[.assets[] | select(.name == "Skia-Linux-Release-x64.zip")][0].browser_download_url' <<<"${skia_json}")" && [ -n "${skia_zip_url}" ] || { echo "Failed to find skia zip" >&2; exit 1; }

          deb_version="$(clean_version "${aseprite_tag}" 'A-Za-z0-9.+:~')" && [ -n "${deb_version}" ] || { echo "Failed to compute deb version" >&2; exit 1; }
          pkgver="$(clean_version "${aseprite_tag}" 'A-Za-z0-9._')" && [ -n "${pkgver}" ] || { echo "Failed to compute pkgver" >&2; exit 1; }
          deb_revision="$(clean_version "${INPUT_DEB_REVISION}" 'A-Za-z0-9+.~')" && [ -n "${deb_revision}" ] || { echo "Invalid deb revision" >&2; exit 1; }

          {
            echo "aseprite_tag=${aseprite_tag}"
            echo "source_zip_url=${source_zip_url}"
            echo "skia_release_tag=${skia_release_tag}"
            echo "skia_zip_url=${skia_zip_url}"
            echo "deb_version=${deb_version}"
            echo "deb_revision=${deb_revision}"
            echo "release_tag=${INPUT_RELEASE_TAG:-aseprite-${aseprite_tag}-debian13-x64}"
            echo "release_name=${INPUT_RELEASE_NAME:-Aseprite ${aseprite_tag} for Debian 13 (x64)}"
            echo "tar_name=aseprite-${aseprite_tag}-debian13-x64.tar.xz"
            echo "deb_name=aseprite_${deb_version}-${deb_revision}_amd64.deb"
            echo "pkgver=${pkgver}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download Aseprite source and Skia
        id: download
        env:
          SOURCE_ZIP_URL: ${{ steps.meta.outputs.source_zip_url }}
          SKIA_ZIP_URL: ${{ steps.meta.outputs.skia_zip_url }}
        run: |
          set -euo pipefail
          mkdir -p work/{src,deps/skia}

          curl -fL "${SOURCE_ZIP_URL}" -o work/src/source.zip && unzip -q work/src/source.zip -d work/src
          curl -fL "${SKIA_ZIP_URL}" -o work/deps/skia.zip && unzip -q work/deps/skia.zip -d work/deps/skia

          find_project_root() {
            local search_dir="$1"
            [ -f "${search_dir}/CMakeLists.txt" ] && grep -Eqi '^[[:space:]]*project[[:space:]]*\([[:space:]]*aseprite' "${search_dir}/CMakeLists.txt" && echo "${search_dir}" && return 0
            while IFS= read -r f; do
              if grep -Eqi '^[[:space:]]*project[[:space:]]*\([[:space:]]*aseprite' "$f" 2>/dev/null; then
                dirname "$f"
                return 0
              fi
            done < <(find "${search_dir}" -mindepth 2 -maxdepth 4 -type f -name CMakeLists.txt | head -n 20)
          }

          source_dir="$(find_project_root "work/src")" || { echo "Failed to locate Aseprite source root" >&2; exit 1; }
          skia_lib="$(find work/deps/skia -type f -path '*/out/Release-x64/libskia.a' -print -quit)" || { echo "Failed to locate libskia.a" >&2; exit 1; }
          skia_dir="${skia_lib%/out/Release-x64/libskia.a}"

          echo "source_dir=$(realpath "${source_dir}")" >> "${GITHUB_OUTPUT}"
          echo "skia_dir=$(realpath "${skia_dir}")" >> "${GITHUB_OUTPUT}"
          echo "skia_library_dir=$(realpath "${skia_dir}/out/Release-x64")" >> "${GITHUB_OUTPUT}"
          echo "skia_library=$(realpath "${skia_dir}/out/Release-x64/libskia.a")" >> "${GITHUB_OUTPUT}"

      - name: Build Aseprite
        env:
          SOURCE_DIR: ${{ steps.download.outputs.source_dir }}
          SKIA_DIR: ${{ steps.download.outputs.skia_dir }}
          SKIA_LIBRARY_DIR: ${{ steps.download.outputs.skia_library_dir }}
          SKIA_LIBRARY: ${{ steps.download.outputs.skia_library }}
        run: |
          set -euo pipefail
          export CC=clang
          export CXX=clang++

          cmake -S "${SOURCE_DIR}" -B "${SOURCE_DIR}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS:STRING=-stdlib=libstdc++ \
            -DCMAKE_EXE_LINKER_FLAGS:STRING=-stdlib=libstdc++ \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="${SKIA_DIR}" \
            -DSKIA_LIBRARY_DIR="${SKIA_LIBRARY_DIR}" \
            -DSKIA_LIBRARY="${SKIA_LIBRARY}"

          ninja -C "${SOURCE_DIR}/build" aseprite

      - name: Package tar.xz and deb
        env:
          SOURCE_DIR: ${{ steps.download.outputs.source_dir }}
          ASEPRITE_TAG: ${{ steps.meta.outputs.aseprite_tag }}
          TAR_NAME: ${{ steps.meta.outputs.tar_name }}
          DEB_VERSION: ${{ steps.meta.outputs.deb_version }}
          DEB_REVISION: ${{ steps.meta.outputs.deb_revision }}
          DEB_NAME: ${{ steps.meta.outputs.deb_name }}
        run: |
          set -euo pipefail

          find_file() { for f in "$@"; do [ -f "$f" ] && { echo "$f"; return 0; }; done; }
          copy_asset() { local src="$1" dst="$2" && [ -f "$src" ] && cp "$src" "$dst"; }

          release_dir="work/dist/aseprite-${ASEPRITE_TAG}-debian13-x64"
          mkdir -p "${release_dir}"
          install -m 0755 "${SOURCE_DIR}/build/bin/aseprite" "${release_dir}/aseprite"
          strip --strip-unneeded "${release_dir}/aseprite" || true
          cp -a "${SOURCE_DIR}/build/bin/data" "${release_dir}/data"
          copy_asset "$(find_file "${SOURCE_DIR}/LICENSE" "${SOURCE_DIR}/LICENSE.txt" "${SOURCE_DIR}/EULA.txt")" "${release_dir}/LICENSE"
          tar -C work/dist -cJf "work/dist/${TAR_NAME}" "$(basename "${release_dir}")"

          # Create deb package
          pkg_root="work/pkgroot"
          rm -rf "${pkg_root}"
          mkdir -p "${pkg_root}"/{DEBIAN,usr/lib/aseprite,usr/bin,usr/share/{doc/aseprite,applications,pixmaps}}

          install -m 0755 "${SOURCE_DIR}/build/bin/aseprite" "${pkg_root}/usr/lib/aseprite/aseprite"
          strip --strip-unneeded "${pkg_root}/usr/lib/aseprite/aseprite" || true
          cp -a "${SOURCE_DIR}/build/bin/data" "${pkg_root}/usr/lib/aseprite/data"
          cat > "${pkg_root}/usr/bin/aseprite" <<'EOF'
          #!/bin/sh
          exec /usr/lib/aseprite/aseprite "$@"
          EOF
          chmod 0755 "${pkg_root}/usr/bin/aseprite"

          # Install icon
          icon="$(find_file "${SOURCE_DIR}/build/bin/data/icons/ase256.png" "${SOURCE_DIR}/build/bin/data/icons/ase128.png" "${SOURCE_DIR}/build/bin/data/icons/ase64.png" "${SOURCE_DIR}/data/icons/ase256.png" "${SOURCE_DIR}/data/icons/ase128.png" "${SOURCE_DIR}/data/icons/ase64.png")"
          [ -z "$icon" ] && icon="$(find "${SOURCE_DIR}" -type f \( -iname 'aseprite*.png' -o -iname 'ase*.png' \) 2>/dev/null | head -1)"
          [ -n "$icon" ] && install -m 0644 "$icon" "${pkg_root}/usr/share/pixmaps/aseprite.png"

          cat > "${pkg_root}/usr/share/applications/aseprite.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Aseprite
          GenericName=Pixel Art Editor
          Comment=Animated sprite editor and pixel art tool
          Exec=/usr/bin/aseprite %F
          Icon=aseprite
          Terminal=false
          Categories=Graphics;2DGraphics;RasterGraphics;
          StartupWMClass=aseprite
          EOF
          chmod 0644 "${pkg_root}/usr/share/applications/aseprite.desktop"

          copy_asset "$(find_file "${SOURCE_DIR}/LICENSE" "${SOURCE_DIR}/LICENSE.txt" "${SOURCE_DIR}/EULA.txt")" "${pkg_root}/usr/share/doc/aseprite/copyright"

          # Resolve dependencies
          debhelper_dir="work/debhelper"
          mkdir -p "${debhelper_dir}/debian"
          cat > "${debhelper_dir}/debian/control" <<'EOF'
          Source: aseprite
          Section: graphics
          Priority: optional
          Maintainer: GitHub Actions <actions@github.com>
          Standards-Version: 4.6.2

          Package: aseprite
          Architecture: amd64
          Description: Aseprite built from upstream release for Debian 13
          EOF

          bin_path="$(realpath "${pkg_root}/usr/lib/aseprite/aseprite")"
          deb_depends="$(dpkg-shlibdeps "${bin_path}" 2>/dev/null | sed -n 's/^shlibs:Depends=//p' || true)"
          [ -n "${deb_depends}" ] || { echo "Failed to resolve dependencies" >&2; exit 1; }
          installed_size="$(du -ks "${pkg_root}/usr" | cut -f1)"

          cat > "${pkg_root}/DEBIAN/control" <<EOF
          Package: aseprite
          Version: ${DEB_VERSION}-${DEB_REVISION}
          Section: graphics
          Priority: optional
          Architecture: amd64
          Maintainer: GitHub Actions <actions@github.com>
          Depends: ${deb_depends}
          Installed-Size: ${installed_size}
          Description: Aseprite built from upstream release for Debian 13
           Aseprite Linux binary package built in GitHub Actions.
          EOF

          dpkg-deb --build --root-owner-group -Zxz -z9 "${pkg_root}" "work/dist/${DEB_NAME}"
          dpkg-deb -I "work/dist/${DEB_NAME}"

      - name: Upload Debian build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-dist-${{ steps.meta.outputs.aseprite_tag }}
          path: |
            work/dist/${{ steps.meta.outputs.tar_name }}
            work/dist/${{ steps.meta.outputs.deb_name }}
          if-no-files-found: error

  build-arch-package:
    needs: build-debian-assets
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_arch_package == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install Arch packaging dependencies
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Syu --noconfirm --needed base-devel
          pacman -S --noconfirm --needed \
            libx11 libxcursor libxi libxrandr \
            fontconfig mesa libwebp

      - name: Download Debian tar artifact
        uses: actions/download-artifact@v4
        with:
          name: debian-dist-${{ needs.build-debian-assets.outputs.aseprite_tag }}
          path: work/dist

      - name: Build Arch package
        id: arch
        env:
          TAR_NAME: ${{ needs.build-debian-assets.outputs.tar_name }}
          PKGVER: ${{ needs.build-debian-assets.outputs.pkgver }}
          ARCH_PKGREL: ${{ github.event.inputs.arch_pkgrel || '1' }}
        run: |
          set -euo pipefail
          [[ "${ARCH_PKGREL}" =~ ^[0-9]+$ ]] || { echo "arch_pkgrel must contain only digits" >&2; exit 1; }

          mkdir -p work/arch
          cp "work/dist/${TAR_NAME}" "work/arch/aseprite.tar.xz"
          tar_sha256="$(sha256sum "work/arch/aseprite.tar.xz" | awk '{print $1}')"

          cat > "work/arch/PKGBUILD" <<'EOFPKG'
          find_file() { for f in "$@"; do [ -f "$f" ] && { echo "$f"; return 0; }; done; }

          pkgname=aseprite-bin
          pkgver=PKGVER_PLACEHOLDER
          pkgrel=PKGREL_PLACEHOLDER
          pkgdesc='Aseprite binary package built from upstream release'
          arch=('x86_64')
          url='https://www.aseprite.org/'
          license=('custom')
          provides=('aseprite')
          conflicts=('aseprite')
          depends=('glibc' 'gcc-libs' 'libx11' 'libxcursor' 'libxi' 'libxrandr' 'fontconfig' 'mesa' 'libwebp')
          source=('aseprite.tar.xz')
          sha256sums=('SHA256_PLACEHOLDER')

          package() {
            local src_root="$(find "${srcdir}" -mindepth 1 -maxdepth 1 -type d | head -1)" && [ -n "$src_root" ] || { echo "Failed to locate extracted directory" >&2; exit 1; }
            install -Dm755 "${src_root}/aseprite" "${pkgdir}/usr/lib/aseprite/aseprite"
            cp -a "${src_root}/data" "${pkgdir}/usr/lib/aseprite/data"

            install -dm755 "${pkgdir}/usr/bin"
            printf '#!/bin/sh\nexec /usr/lib/aseprite/aseprite "$@"\n' > "${pkgdir}/usr/bin/aseprite"
            chmod 0755 "${pkgdir}/usr/bin/aseprite"

            local icon="$(find_file "${src_root}/data/icons/ase256.png" "${src_root}/data/icons/ase128.png" "${src_root}/data/icons/ase64.png")"
            [ -z "$icon" ] && icon="$(find "${src_root}" -type f \( -iname 'aseprite*.png' -o -iname 'ase*.png' \) 2>/dev/null | head -1)"
            [ -n "$icon" ] && install -Dm644 "$icon" "${pkgdir}/usr/share/pixmaps/aseprite.png"

            install -dm755 "${pkgdir}/usr/share/applications"
            cat > "${pkgdir}/usr/share/applications/aseprite.desktop" <<'EOFDESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Aseprite
          GenericName=Pixel Art Editor
          Comment=Animated sprite editor and pixel art tool
          Exec=/usr/bin/aseprite %F
          Icon=aseprite
          Terminal=false
          Categories=Graphics;2DGraphics;RasterGraphics;
          StartupWMClass=aseprite
          EOFDESKTOP
            chmod 0644 "${pkgdir}/usr/share/applications/aseprite.desktop"

            local license="$(find_file "${src_root}/LICENSE" "${src_root}/LICENSE.txt" "${src_root}/EULA.txt")" || { echo "Failed to locate license" >&2; exit 1; }
            install -Dm644 "$license" "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"
          }
          EOFPKG

          sed -i "s/PKGVER_PLACEHOLDER/${PKGVER}/g; s/PKGREL_PLACEHOLDER/${ARCH_PKGREL}/g; s/SHA256_PLACEHOLDER/${tar_sha256}/g" "work/arch/PKGBUILD"

          id builder >/dev/null 2>&1 || useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          runuser -u builder -- bash -lc "cd '${GITHUB_WORKSPACE}/work/arch' && makepkg -f --noconfirm --nodeps"

          arch_pkg="$(find "work/arch" -maxdepth 1 -name 'aseprite-bin-*.pkg.tar.zst' -print -quit)" || { echo "Failed to locate generated package" >&2; exit 1; }
          cp "${arch_pkg}" "work/dist/"
          echo "arch_pkg_name=$(basename "${arch_pkg}")" >> "${GITHUB_OUTPUT}"

      - name: Verify Arch package metadata
        env:
          ARCH_PKG_NAME: ${{ steps.arch.outputs.arch_pkg_name }}
        run: |
          set -euo pipefail
          pkg_path="work/dist/${ARCH_PKG_NAME}"
          listing="$(pacman -Qlp "${pkg_path}")"

          for path in /usr/bin/aseprite /usr/lib/aseprite/aseprite /usr/lib/aseprite/data/ /usr/share/applications/aseprite.desktop /usr/share/pixmaps/aseprite.png /usr/share/licenses/aseprite-bin/LICENSE; do
            grep -qF " ${path}" <<<"${listing}" || { echo "Missing path: ${path}" >&2; exit 1; }
          done

          pacman -Qp "${pkg_path}"

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-dist-${{ needs.build-debian-assets.outputs.aseprite_tag }}
          path: work/dist/${{ steps.arch.outputs.arch_pkg_name }}
          if-no-files-found: error

  publish-draft-release:
    needs: [build-debian-assets, build-arch-package]
    if: ${{ always() && needs.build-debian-assets.result == 'success' && (needs.build-arch-package.result == 'success' || needs.build-arch-package.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debian-dist-${{ needs.build-debian-assets.outputs.aseprite_tag }}
          path: work/release-dist

      - uses: actions/download-artifact@v4
        if: needs.build-arch-package.result == 'success'
        with:
          name: arch-dist-${{ needs.build-debian-assets.outputs.aseprite_tag }}
          path: work/release-dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-debian-assets.outputs.release_tag }}
          name: ${{ needs.build-debian-assets.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: work/release-dist/*
